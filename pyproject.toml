[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "note2-pinn-pidl-cyber-control"
version = "0.2.0"
description = "Tutorial code for PINN, PIDL, inverse modeling, and neural optimal-control examples in cyber systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Luxing Yang"}]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "networkx",
    "torch",
    "cybercontrol @ git+https://github.com/LYang910920/network-control-differential-games.git@40236dd12e4ba911a244a3ca7a9bc5456743c55d",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cyberpinn = "cyberpinn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
extend-ignore = [
    "E402",  # scripts set the local execution path before importing tutorial modules
    "E741",  # compartment notation uses I for infected state
]
