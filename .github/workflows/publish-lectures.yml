name: Publish reviewed lecture
on:
  push:
    paths: [.github/workflows/publish-lectures.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Keep the complete contents on one page
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('docs/source/note2_pinn_pidl_cyber_control.tex')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '7cdc9786a5daa69b64ab140460060bcfa27a9498a1dc73793ae91b1895c63608'
          old = rb'\begingroup\setlength{\parskip}{0pt}\footnotesize\tableofcontents\endgroup'
          new = rb'\begingroup\setlength{\parskip}{0pt}\footnotesize\linespread{0.90}\selectfont\tableofcontents\endgroup'
          assert data.count(old) == 1
          data = data.replace(old, new)
          assert hashlib.sha256(data).hexdigest() == 'f36373438cb50608307d78ca39ef640cec02a699581609b590222383be81c9f7'
          path.write_bytes(data)
          PY
      - name: Verify code and examples
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[dev]'
          ruff check .
          ruff format --check src tests scripts
          pytest -q
          python -m cyberpinn check
          python -m cyberpinn --output-dir results/lecture
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/source
          root_file: note2_pinn_pidl_cyber_control.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Publish the final layout
        run: |
          if grep -E 'Overfull|undefined references|undefined citations' docs/source/note2_pinn_pidl_cyber_control.log; then exit 1; fi
          cp docs/source/note2_pinn_pidl_cyber_control.pdf docs/note2_pinn_pidl_cyber_control.pdf
          git config user.name 'LYang910920'
          git config user.email '20222003+LYang910920@users.noreply.github.com'
          git add docs/source/note2_pinn_pidl_cyber_control.tex docs/note2_pinn_pidl_cyber_control.pdf
          git commit -m 'Keep the PINN lecture contents together and publish the final PDF'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-lecture
          path: |
            docs/note2_pinn_pidl_cyber_control.pdf
            docs/source/note2_pinn_pidl_cyber_control.tex
            src/cyberpinn/pmp.py
            src/cyberpinn/pidl.py
            tests/test_lecture_conditions.py
          retention-days: 7
